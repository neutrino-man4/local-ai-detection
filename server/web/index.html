<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Text Detector</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #6b7280;
    --border: #e5e7eb; --track: #e8eaee; --accent: #4f46e5; --accent-text: #ffffff;
    --error: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e7e9ee; --muted: #8b93a1;
      --border: #262a33; --track: #2a2f39; --accent: #6366f1; --accent-text: #ffffff;
      --error: #fb923c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 32px; }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; margin-bottom: 16px;
  }
  [hidden] { display: none !important; }

  /* Score ring: 240 px box, r = 108, stroke 12, inner diameter 204 px */
  .ring { position: relative; width: 240px; height: 240px; margin: 8px auto 4px; }
  .ring svg { display: block; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 12; }
  .ring .track { stroke: var(--track); }
  .ring .arc {
    stroke-linecap: round;
    transition: stroke-dashoffset 0.9s cubic-bezier(.2,.7,.2,1), stroke 0.9s ease;
  }
  /* Text block stays well inside the inner circle (width 143 px = 70 % of 204 px) */
  .ring-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 143px; text-align: center;
  }
  .pct { font-size: 44px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
  .pct small { font-size: 22px; font-weight: 600; margin-left: 1px; }
  .verdict { margin-top: 8px; font-size: 13px; line-height: 17px; color: var(--muted); }
  .verdict span { display: block; white-space: nowrap; }
  .model { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }

  textarea {
    width: 100%; min-height: 220px; resize: none; overflow: hidden;
    border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    background: transparent; color: var(--text); font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  textarea[readonly] { opacity: 0.6; }
  .shaded {
    min-height: 220px; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .shaded span { border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

  .actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .error { flex: 1; color: var(--error); font-size: 13px; }
  button {
    font: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; padding: 9px 18px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  }
  button:disabled { cursor: default; opacity: 0.7; }
  .primary { background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent); }
  .secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%; display: none;
    border: 2px solid rgba(255,255,255,0.4); border-top-color: var(--accent-text);
    animation: spin 0.8s linear infinite;
  }
  .busy .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>AI Text Detector</h1>
    <p class="sub">Paste a text of any length. Everything runs locally on this machine.</p>
  </header>

  <section id="result" class="card" hidden aria-live="polite">
    <div class="ring">
      <svg width="240" height="240" viewBox="0 0 240 240" aria-hidden="true">
        <circle class="track" cx="120" cy="120" r="108"></circle>
        <circle id="arc" class="arc" cx="120" cy="120" r="108"></circle>
      </svg>
      <div class="ring-center">
        <div id="pct" class="pct">0<small>%</small></div>
        <div id="verdict" class="verdict"></div>
      </div>
    </div>
    <div id="model" class="model"></div>
  </section>

  <section class="card">
    <textarea id="input" placeholder="Paste text here..." aria-label="Text to analyze"></textarea>
    <div id="shaded" class="shaded" hidden></div>
    <div class="actions">
      <span id="error" class="error" role="alert"></span>
      <button id="edit" class="secondary" hidden>Edit</button>
      <button id="analyze" class="primary" title="Ctrl+Enter"><span class="spinner"></span>Analyze</button>
    </div>
  </section>

  <footer>Scores are statistical estimates, not proof of authorship.</footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const input = $("input"), shaded = $("shaded"), analyzeBtn = $("analyze"), editBtn = $("edit");
  const arc = $("arc"), CIRC = 2 * Math.PI * 108;
  arc.style.strokeDasharray = CIRC;
  arc.style.strokeDashoffset = CIRC;

  // Green fades from bright (0 %) to faded (50 %); red goes from faded (50 %) to bright (100 %)
  function scoreColor(s, alpha = 1) {
    let h, sat, l;
    if (s < 50) { const t = s / 50; h = 142; sat = 75 - 55 * t; l = 42 + 8 * t; }
    else { const t = (s - 50) / 50; h = 0; sat = 20 + 65 * t; l = 50; }
    return `hsla(${h}, ${sat.toFixed(1)}%, ${l.toFixed(1)}%, ${alpha})`;
  }

  // Half-open bands on the displayed (floored) value, so the shown number and verdict always agree
  function verdict(d) {
    if (d < 10) return ["Human"];
    if (d < 35) return ["Human with AI editing"];
    if (d < 70) return ["Uncertain:", "AI with human editing"];
    if (d < 90) return ["Mostly AI"];
    return ["Fully AI"];
  }

  const shown = (s) => Math.min(100, Math.max(0, Math.floor(s)));

  function autoGrow() { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; }

  function setBusy(busy) {
    analyzeBtn.disabled = busy;
    analyzeBtn.classList.toggle("busy", busy);
    input.readOnly = busy;
  }

  function renderRing(s) {
    const d = shown(s);
    $("pct").innerHTML = `${d}<small>%</small>`;
    const v = $("verdict");
    v.replaceChildren(...verdict(d).map((line) => {
      const el = document.createElement("span"); el.textContent = line; return el;
    }));
    // Restart the animation from an empty ring on every result
    arc.style.transition = "none";
    arc.style.strokeDashoffset = CIRC;
    arc.style.opacity = s < 0.5 ? 0 : 1;
    arc.getBoundingClientRect();
    arc.style.transition = "";
    arc.style.stroke = scoreColor(s);
    arc.style.strokeDashoffset = CIRC * (1 - Math.min(100, s) / 100);
  }

  function renderSegments(segments) {
    shaded.replaceChildren(...segments.map((seg) => {
      const el = document.createElement("span");
      el.textContent = seg.text;
      el.style.backgroundColor = scoreColor(seg.ai_percent, seg.ai_percent >= 70 ? 0.34 : 0.18);
      el.title = `Segment: ${shown(seg.ai_percent)}% AI`;
      return el;
    }));
  }

  async function analyze() {
    const text = input.value;
    $("error").textContent = "";
    if (!text.trim()) { $("error").textContent = "Please paste some text first."; return; }
    setBusy(true);
    try {
      const res = await fetch("/api/score", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      $("model").textContent = data.model;
      renderSegments(data.segments);
      input.hidden = true; shaded.hidden = false;
      analyzeBtn.hidden = true; editBtn.hidden = false;
      $("result").hidden = false;
      renderRing(data.ai_percent);
    } catch (err) {
      $("error").textContent = err.message;
    } finally {
      setBusy(false);
    }
  }

  function edit() {
    shaded.hidden = true; input.hidden = false;
    editBtn.hidden = true; analyzeBtn.hidden = false;
    $("result").hidden = true;
    autoGrow(); input.focus();
  }

  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); analyze(); }
  });
  analyzeBtn.addEventListener("click", analyze);
  editBtn.addEventListener("click", edit);
</script>
</body>
</html>
